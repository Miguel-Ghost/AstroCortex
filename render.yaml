# Render Blueprint (repo root): one free web service from backend/ (API + model inside) and a free Postgres for marks.
# Virginia is the region closest to the SPHEREx bucket in AWS us-east-1.
services:
  - type: web
    name: spherex-api
    runtime: python
    rootDir: backend
    region: virginia
    plan: free            # switch to "starter" for the demo to avoid the 15-minute spin-down
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        sync: false       # set in the dashboard, e.g. https://<frontend>.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: DATABASE_URL
        fromDatabase:
          name: spherex-db
          property: connectionString
      - key: MODEL_PATH
        sync: false       # e.g. models/model.onnx once the model repo publishes a version
      - key: LLM_API_KEY
        sync: false       # set in the dashboard only; never in the frontend
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai   # any OpenAI-compatible endpoint
      - key: LLM_MODEL
        sync: false       # gemini-3.5-flash-lite: 1.7 s measured on 2026-11-15 (3.5-flash 17 s, 3.8-flash 503)
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_TIMEOUT_S
        value: "6"
      - key: LIVE_FIELDS
        value: "true"     # any RA/Dec without a published field is built from IRSA + S3 on request
      - key: LIVE_CACHE_DIR
        value: /tmp/astrocortex-live   # disk cache of live fields (lost on restart; rebuilt on demand)
      - key: LIVE_TIMEOUT_S
        value: "60"

databases:
  - name: spherex-db
    databaseName: spherex
    user: spherex
    plan: free            # free Postgres expires 30 days after creation: enough for the hackathon
    region: virginia
