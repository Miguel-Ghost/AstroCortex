    params:
      config/motor.json:
        conjuntos:
          catalogo:
            conjunto_ty: E1_nucleo_fisico
            spherex: false
          catalogo_mas_spherex:
            conjunto_ty: E1_nucleo_fisico
            spherex: true
          servible:
            variables:
            - cw_W1_W2
            - cw_mu
            - Hrpm_W2
            spherex: true
        experimentos:
        - nombre: A_catalogo_5clases
          conjunto: catalogo
          objetivo: 5clases
          poblacion: todos
        - nombre: B_catalogo_binario
          conjunto: catalogo
          objetivo: servible
          poblacion: todos
        - nombre: C_catalogo_5clases_subconjunto
          conjunto: catalogo
          objetivo: 5clases
          poblacion: spherex
        - nombre: D_catalogo_spherex_5clases
          conjunto: catalogo_mas_spherex
          objetivo: 5clases
          poblacion: spherex
        - nombre: E_servible_binario
          conjunto: servible
          objetivo: servible
          poblacion: spherex_o_todos
        exportar:
          experimento: E_servible_binario
          clase_fria: cold_brown_dwarf
        modelos:
          potencias_peso_clase:
          - 0.25
          rf:
            n_estimators: 500
            min_samples_leaf: 2
            max_features: sqrt
          xgb:
            n_estimators: 400
            max_depth: 6
            learning_rate: 0.05
            subsample: 0.8
            colsample_bytree: 0.8
            min_child_weight: 1.0
            reg_lambda: 1.0
          mlp:
            capas:
            - 128
            - 64
            dropout: 0.2
            lr: 0.001
            weight_decay: 0.0001
            epocas_max: 150
            paciencia: 15
            batch: 256
            recorte_percentil:
            - 0.5
            - 99.5
          permutaciones: 2
          precision_objetivo_fria: 0.9
          regla_eleccion: mayor macro-F1 en la CV espacial de desarrollo; el 
            test se evalua una sola vez, despues de elegir
        objetivos:
          5clases:
            star: star
            M: M
            L: L
            T: T
            Y: Y
          servible:
            star: star
            M: star
            L: star
            T: cold_brown_dwarf
            Y: cold_brown_dwarf
        preprocesamiento:
          radio_duplicado_arcsec: 2.0
          epoca_comun_duplicados: 2016.0
          limite_fisico_color_mag: 15.0
          outlier_mad_k: 6.0
          max_faltante_dev: 0.97
