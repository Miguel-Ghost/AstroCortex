# Builds and tests the React frontend. Vercel deploys it; this workflow only checks that every push
# to Frontend/ still installs, passes its tests, finds all bundled field data and builds.
name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["Frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["Frontend/**", ".github/workflows/frontend.yml"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Bundled field data (manifests, PNG and BIN paths)
        run: npm run verify:data
      - name: Build
        run: npm run build
