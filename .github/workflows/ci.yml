name: CI

on:
  push:
    branches: [main, backend-skeleton]
    # a push that touches only the frontend or repository-level files neither tests nor redeploys
    # the backend (deploy.yml runs after this workflow)
    paths-ignore:
      - "Frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/keepalive.yml"
      - "README.md"
  pull_request:
    paths-ignore:
      - "Frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/keepalive.yml"
      - "README.md"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .
      - name: Tests
        run: pytest

  # The marks repository runs on PostgreSQL in production but in memory in the default suite.
  # Lesson from the Quality Opportunities backend (its ADR-008): a bug that only PostgreSQL shows
  # reached the demo because the suite never ran against it. This job closes that gap.
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astrocortex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/astrocortex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Full suite with PostgreSQL available (marks repository tests run against it)
        run: pytest
